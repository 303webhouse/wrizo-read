name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  no-hardcoded-values:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Zero hard-coded values (apps/web/src)
        run: node tools/check-no-hardcoded-values.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck all workspaces
        run: pnpm -r typecheck
      - name: Token build emits CSS
        run: pnpm --filter @wrizo/tokens build

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wrizo_read
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/wrizo_read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrations 001–003 apply to a scratch Postgres
        run: pnpm --filter @wrizo/api migrate:up
      - name: API property suite (sealed-linkage, ceiling, canonicalization, atomicity, seeing-law)
        run: pnpm --filter @wrizo/api test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @wrizo/web exec playwright install --with-deps chromium
      - name: Rendered-geometry harness (laptop + tablet, both regimes)
        run: pnpm --filter @wrizo/web test:e2e
